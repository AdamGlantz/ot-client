# Who is working on what (see "Working on an issue" in AGENTS.md):
# - an issue gets the "in progress" label when someone is assigned, and
#   loses it when nobody is
# - a pull request must name the issue it is for ("Closes #12" or a branch
#   called issue-12-...), and that issue must be assigned to the pull
#   request's author, so nobody works on an issue someone else has taken
name: Issue claim

on:
  issues:
    types: [assigned, unassigned]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const busy = issue.assignees.length > 0;
            const has = issue.labels.some((label) => label.name === 'in progress');
            if (busy && !has) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: ['in progress'] });
            } else if (!busy && has) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'in progress' });
            }

  claim:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const numbers = new Set();
            for (const match of (pr.body ?? '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?|part of)\s+#(\d+)/gi)) numbers.add(Number(match[1]));
            const branch = pr.head.ref.match(/(?:^|\/)issue-(\d+)/);
            if (branch) numbers.add(Number(branch[1]));
            if (!numbers.size) {
              core.setFailed('Name the issue this is for: "Closes #12" in the description, or a branch called issue-12-short-name. Small fixes without an issue: open one first (it takes a minute and keeps the work visible).');
              return;
            }
            const problems = [];
            for (const number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number });
              const assignees = issue.assignees.map((user) => user.login);
              if (!assignees.includes(author)) {
                problems.push(assignees.length
                  ? `#${number} is assigned to ${assignees.join(', ')}, not to ${author}: talk to them first.`
                  : `#${number} is not assigned to anyone: assign yourself (it then shows as in progress).`);
              }
            }
            if (problems.length) core.setFailed(problems.join('\n'));
            else core.info(`OK: ${[...numbers].map((n) => '#' + n).join(', ')} assigned to ${author}.`);
