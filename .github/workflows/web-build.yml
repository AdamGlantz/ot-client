name: Web Build

on:
  workflow_dispatch:
  push:
    branches:
      - web-client-792

permissions:
  contents: read

jobs:
  build-browser:
    name: Browser
    uses: ./.github/workflows/reusable-build-browser.yml

  publish:
    name: Publish pre-release
    needs: build-browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: web-client-792-latest
    steps:
      - name: Download browser artifact
        uses: actions/download-artifact@v5
        with:
          name: otclient-browser-${{ github.sha }}

      - name: Package bundle
        run: |
          cd build-emscripten-web
          zip -r ../otclient-web.zip .

      - name: Replace pre-release
        run: |
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" otclient-web.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Web client (web-client-792, ${GITHUB_SHA::7})" \
            --notes "Browser build of ${GITHUB_SHA}. Game assets (Tibia.dat/Tibia.spr) are not included."
